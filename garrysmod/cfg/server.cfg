// ============================================================================
//  Fallout RP
//  server.cfg
//
//  srcds executes this automatically on startup.
//  Gamemode and map are set in startserver.bat, NOT here.
//
//  Current state: LOCAL DEVELOPMENT ONLY (sv_lan 1).
//  See the "GOING PUBLIC" section at the bottom before exposing this server.
// ============================================================================


// ----------------------------------------------------------------------------
//  Identity
// ----------------------------------------------------------------------------

// The em dash you wanted mangles to "Fallout RP" - confirmed by
// reading the live window title off a running server. Source's console parser
// doesn't handle the UTF-8 multibyte sequence, so this uses a plain hyphen.
hostname "Fallout RP"

// Note: sv_tags does not exist in this GMod build - the engine rejects it.
// GMod advertises gamemode/map to the browser automatically instead.

// Steam Game Server Login Token. Only needed for PUBLIC servers.
// Get one at https://steamcommunity.com/dev/managegameservers
// Leave empty while sv_lan is 1.
sv_setsteamaccount ""


// ----------------------------------------------------------------------------
//  Access
// ----------------------------------------------------------------------------

// 1 = LAN only. The server does not heartbeat to the Steam master list and
// only accepts connections from your local network. This is what we want
// right now. Set to 0 when you're ready for outside players.
sv_lan 1

// Password required to join. Empty = no password.
// While sv_lan is 1 this does nothing; set it when you flip sv_lan to 0.
sv_password ""

// RCON: remote console access.
// LEAVE THIS EMPTY while sv_lan is 1 - an empty password disables RCON entirely,
// which is the safe default. If you ever go public, set a long random password
// here yourself. Never reuse a password from anywhere else.
rcon_password ""

// Kick anyone who fails RCON auth 3 times, ban for 5 minutes.
sv_rcon_maxfailures 3
sv_rcon_banpenalty 5

// Region for the server browser. 255 = world / unlisted.
sv_region 255


// ----------------------------------------------------------------------------
//  Security
// ----------------------------------------------------------------------------

// Block clients from running their own Lua (lua_run_cl etc).
// This is important on any RP server - leave it at 0.
sv_allowcslua 0

// Let clients download content from us, but don't let them upload to us.
sv_allowdownload 1
sv_allowupload 0

// Max size in MB for a single file sent to a client.
net_maxfilesize 64

// Don't kick players for Lua errors - during development we WANT to see them
// and keep testing. Revisit before going live.
sv_kickerrornum 0

// Seconds before an unresponsive client is dropped.
sv_timeout 120


// ----------------------------------------------------------------------------
//  Sandbox lockdown
//
//  Helix derives from the sandbox gamemode, so sandbox convars still apply.
//  Without these, any player can open the spawnmenu and spawn props.
//  Admin mods can grant these back to staff later.
// ----------------------------------------------------------------------------

sbox_noclip 0
sbox_godmode 0

// PvP must stay ON - this is a raid/war server.
sbox_playershurtplayers 1

// No sandbox weapon loadout; Helix hands out weapons via factions and items.
sbox_weapons 0

// Bone manipulation is a common exploit vector (hitbox abuse). Keep it off.
sbox_bonemanip_player 0
sbox_bonemanip_npc 0
sbox_bonemanip_misc 0

sbox_maxprops 0
sbox_maxragdolls 0
sbox_maxnpcs 0
sbox_maxballoons 0
sbox_maxeffects 0
sbox_maxdynamite 0
sbox_maxlamps 0
sbox_maxlights 0
sbox_maxthrusters 0
sbox_maxwheels 0
sbox_maxhoverballs 0
sbox_maxvehicles 0
sbox_maxbuttons 0
sbox_maxsents 0
sbox_maxemitters 0

// Note: sbox_maxspawners and sbox_maxturrets don't exist until the addons
// that create them are installed. Add them back if we install those tools.

// Persist props placed by staff across map changes (used by permaprops).
sbox_persist ""


// ----------------------------------------------------------------------------
//  Gameplay
// ----------------------------------------------------------------------------

// Voice chat on, but NOT global - Helix handles proximity/radio itself.
sv_voiceenable 1
sv_alltalk 0

// Standard HL2 gravity.
sv_gravity 600

// Real fall damage rather than the flat 10.
mp_falldamage 1

// Don't let players pick up props with +use.
sv_playerpickupallowed 0

// Cut down on decal spam over long sessions.
decalfrequency 20

// No automatic map switching - RP servers stay on one map.
// (mp_winlimit / mp_fraglimit are not GMod convars, so they're omitted.)
mp_timelimit 0


// ----------------------------------------------------------------------------
//  Networking / performance
//
//  TICKRATE IS 16 - set with -tickrate 16 in startserver.bat, NOT here.
//  It cannot be changed from a cfg file.
//
//  The rates below are matched to it on purpose. The engine clamps update and
//  command rates to the tickrate anyway, so leaving the old 30/66 bounds here
//  would just mean clients negotiate a rate the server never actually meets.
//  If you change the tickrate, change these to match.
// ----------------------------------------------------------------------------

sv_minrate 100000
sv_maxrate 0

sv_mincmdrate 16
sv_maxcmdrate 16

sv_minupdaterate 16
sv_maxupdaterate 16

// Let the server run as fast as it can rather than capping the main loop.
fps_max 0

// Physics solver quality. 4 is the GMod default; raising it costs CPU.
gmod_physiterations 4

// Lag compensation window for hitreg. (sv_unlag itself isn't a GMod convar;
// lag compensation is always on and controlled per-weapon in Lua.)
sv_maxunlag 0.5


// ----------------------------------------------------------------------------
//  Logging
//
//  Writes to garrysmod/logs/. Useful for debugging the schema as we build it.
// ----------------------------------------------------------------------------

log on
sv_logfile 1
sv_logecho 1
sv_logbans 1
sv_log_onefile 0


// ----------------------------------------------------------------------------
//  GOING PUBLIC - checklist for later, do NOT uncomment yet
// ----------------------------------------------------------------------------
//
//  1. sv_lan 0
//  2. sv_setsteamaccount "<your GSLT>"     - required, or you'll be unlisted
//  3. rcon_password "<long random string>" - or leave empty to keep RCON off
//  4. sv_password "<password>"             - if you want it invite-only
//  5. sv_kickerrornum back to a sane value once the schema is stable
//  6. Content delivery - pick ONE:
//
//     Workshop collection (what you said you'd make):
//       host_workshop_collection <collection id>
//     ...and add -authkey <key> to startserver.bat.
//     Get the key at https://steamcommunity.com/dev/apikey
//
//     Or FastDL over HTTP:
//       sv_downloadurl "https://your.host/garrysmod/"
//
//  7. Revisit sbox_* if staff need spawn access through an admin mod instead.
//
// ============================================================================
